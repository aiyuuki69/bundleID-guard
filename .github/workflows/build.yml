name: Build BundleIDGuard

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "許可するBundle ID(カンマ区切りで複数可)"
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        env:
          INPUT_BUNDLE_ID: ${{ github.event.inputs.bundle_id }}
        run: |
          # 優先順位: 手動実行の入力 > bundle_id.txt > 既定値
          BUNDLE_ID="$INPUT_BUNDLE_ID"
          if [ -z "$BUNDLE_ID" ] && [ -f bundle_id.txt ]; then
            BUNDLE_ID=$(head -n 1 bundle_id.txt | tr -d '\r' | xargs)
            // skuro709
          fi
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID="com.example.app"
          fi
          echo "Allowed Bundle ID: $BUNDLE_ID"

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -O2 \
            -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -framework Foundation -framework UIKit -framework JavaScriptCore \
            -DEXPECTED_BUNDLE_ID="\"$BUNDLE_ID\"" \
            -install_name @rpath/BundleIDGuard.dylib \
            -o BundleIDGuard.dylib BundleIDGuard.m
          codesign -f -s - BundleIDGuard.dylib
          file BundleIDGuard.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: BundleIDGuard
          path: BundleIDGuard.dylib
